version = 4
# The initial guard: review cycles 1–2 proceed normally; cycle 3+ requires a
# Lead convergence assessment. Human review sets any eventual hard stop.
assessment_after_cycles = 2

# Replace every placeholder with a recipe validated on this machine.
# Native args are provider-specific; do not use global harness defaults.
# Approval and sandbox are provider-native recipe policy, not SLP authority.
# Codex "on-request" may pause; trusted local runs may choose "never".
# `never` removes prompts only; it does not expand `workspace-write`.
# Linked worktrees may need provider-native writable roots for Git common metadata.
# Set approval_required=true only for an approval-gated capability; it conflicts
# with Codex `--ask-for-approval never`. Other providers keep native args here;
# do not translate them into a generic SLP permission model.
[roles.lead]
kind = "<lead-kind>"
args = ["<lead-native-arg>"]
cost_class = "standard"
# approval_required = true

# Optional; it never authorizes or auto-launches a Supervisor.
[roles.supervisor]
kind = "<supervisor-kind>"
args = ["<supervisor-native-arg>"]
cost_class = "standard"
# approval_required = true

# Recipes are Human-approved capabilities; Assignment supplies disposition.
[peer_recipes."<recipe-name>"]
description = "<capability-cost-independence-and-access-summary>"
kind = "<peer-kind>"
args = ["<peer-native-arg>"]
cost_class = "standard" # or "elevated"; elevated launch needs Human approval
# approval_required = true

# Route every disposition through an explicit allowlist. There is no implicit
# fallback: custom dispositions use routing.default.
[routing.engineer]
default_recipe = "<recipe-name>"
allowed_recipes = ["<recipe-name>"]

[routing.reviewer]
default_recipe = "<recipe-name>"
allowed_recipes = ["<recipe-name>"]

[routing.architect]
default_recipe = "<recipe-name>"
allowed_recipes = ["<recipe-name>"]

[routing.default]
default_recipe = "<recipe-name>"
allowed_recipes = ["<recipe-name>"]
